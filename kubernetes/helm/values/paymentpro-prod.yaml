# Helm values for: PaymentPro-Prod (503561424407)
# Region: us-east-1 | HIGH PRIORITY

account:
  id: "503561424407"
  name: "paymentpro-prod"
  environment: "production"
  region: "us-east-1"
  team: "paymentpro"

amp:
  workspaceId: "PROD_WORKSPACE_ID"
  region: "us-east-1"
  centralAccountId: "426336593251"
  crossAccountRoleArn: "arn:aws:iam::426336593251:role/AMP-CrossAccount-RemoteWrite"

serviceAccount:
  name: amp-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::503561424407:role/AMP-RemoteWrite-Role"

sigv4proxy:
  image: public.ecr.aws/aws-observability/aws-sigv4-proxy:latest
  port: 8005

prometheus:
  scrapeInterval: "10s"         # More frequent for payment workloads
  evaluationInterval: "10s"
  retention: "1d"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  remoteWrite:
    queueConfig:
      maxSamplesPerSend: 2000
      maxShards: 200
      capacity: 5000
